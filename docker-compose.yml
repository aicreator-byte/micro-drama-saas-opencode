version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: micro-drama-postgres
    environment:
      POSTGRES_DB: micro_drama
      POSTGRES_USER: micro_drama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-micro_drama_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micro_drama -d micro_drama"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: micro-drama-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: micro-drama-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://micro_drama:${POSTGRES_PASSWORD:-micro_drama_password}@postgres:5432/micro_drama
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your-encryption-key-change-in-production}
      CORS_ORIGINS: '["http://localhost:3000", "http://frontend:3000"]'
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 104857600
      GOOGLE_ACCOUNTS_MAX_PER_USER: 20
    volumes:
      - ./app/backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: micro-drama-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Optional: Celery worker for background tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: micro-drama-worker
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://micro_drama:${POSTGRES_PASSWORD:-micro_drama_password}@postgres:5432/micro_drama
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your-encryption-key-change-in-production}
    volumes:
      - ./app/backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: